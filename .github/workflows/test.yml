name: Test

permissions:
  contents: read
  packages: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Install package on ${{ matrix.python-version }}
      uses: ./.github/actions/install
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run tests
      run: python -m pytest tests
